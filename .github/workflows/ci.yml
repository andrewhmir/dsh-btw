name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: client bundle is current
        run: node tools/build-client.mjs --check
      - name: client bundle parses
        run: node --check client.js
      - name: unit and tooling suites
        run: node --test "test/*.test.mjs"
      - name: published file set
        run: npm pack --dry-run
